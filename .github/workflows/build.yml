name: Build VCamTweak

on:
  push:
    branches: [ main, master ]
    paths:
      - 'VCamTweak/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: |
          brew install ldid make perl rsync
          sudo xcode-select --switch /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          # 下载 iOS SDK
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ./
          rm -rf sdks-master master.zip
          ls ~/theos/sdks/

      - name: Build VCamTweak (rootless scheme)
        run: |
          export THEOS=~/theos
          export PATH=$THEOS/bin:$PATH
          cd $GITHUB_WORKSPACE/VCamTweak
          make clean || true
          rm -rf packages obj .theos
          # 使用 rootless scheme 生成 rootless 格式 deb
          # roothide 用户安装前需用 roothidepatcher 转换
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          echo "=== Build artifacts ==="
          ls -la packages/
          echo "=== dylib architecture ==="
          find .theos/obj -name "*.dylib" -exec file {} \;
          echo "=== arm64e capability bits (应为 0x80) ==="
          # fat dylib
          FAT=.theos/obj/VCamTweak.dylib
          if [ -f "$FAT" ]; then
            otool -hv "$FAT"
          fi
          # 单架构 dylib
          for arch in arm64 arm64e; do
            DYLIB=.theos/obj/$arch/VCamTweak.dylib
            if [ -f "$DYLIB" ]; then
              echo "--- $arch ---"
              otool -hv "$DYLIB"
            fi
          done

      - name: Verify rootless deb format
        run: |
          echo "=== 验证 rootless deb 格式（macOS 使用 ar + tar 替代 dpkg-deb）==="
          cd $GITHUB_WORKSPACE/VCamTweak
          DEB=$(ls packages/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then
            echo "❌ 没找到 deb 文件"
            exit 1
          fi
          echo "deb 文件: $DEB"
          # deb 是 ar 归档，包含 debian-binary / control.tar.* / data.tar.*
          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"
          ar x "$GITHUB_WORKSPACE/VCamTweak/$DEB"
          echo "=== ar 归档内容 ==="
          ls -la
          # 解压 control 提取 Architecture 字段
          echo "=== control 内容 ==="
          mkdir control_dir && (tar -xz -f control.tar.gz -C control_dir 2>/dev/null || tar -x -f control.tar -C control_dir 2>/dev/null || true)
          cat control_dir/control 2>/dev/null || echo "(无法解压 control)"
          ARCH=$(grep -E "^Architecture:" control_dir/control 2>/dev/null | awk '{print $2}' | tr -d '\r\n')
          echo "提取到 Architecture: '$ARCH'"
          if [ "$ARCH" = "iphoneos-arm64" ]; then
            echo "✅ rootless 格式正确 (Architecture: iphoneos-arm64)"
          else
            echo "❌ Architecture 不是 iphoneos-arm64，rootless scheme 未生效"
            exit 1
          fi
          # 检查 data.tar 中的安装路径
          echo "=== 安装路径（rootless 应为 ./var/jb/...）==="
          (tar -tz -f data.tar.gz 2>/dev/null || tar -t -f data.tar 2>/dev/null || tar -tJ -f data.tar.xz 2>/dev/null) | head -50
          # 验证没有 rootfs 路径（rootful 标识）
          if (tar -tz -f data.tar.gz 2>/dev/null || tar -t -f data.tar 2>/dev/null || tar -tJ -f data.tar.xz 2>/dev/null) | grep -q "\./rootfs/"; then
            echo "❌ 检测到 ./rootfs/ 路径，这是 rootful 格式，错误！"
            exit 1
          else
            echo "✅ 无 rootfs 路径，确认是 rootless 格式"
          fi
          # 验证包含 /var/jb/ 路径
          if (tar -tz -f data.tar.gz 2>/dev/null || tar -t -f data.tar 2>/dev/null || tar -tJ -f data.tar.xz 2>/dev/null) | grep -q "var/jb/"; then
            echo "✅ 检测到 var/jb/ 路径，确认是 rootless 格式"
          else
            echo "⚠️  未检测到 var/jb/ 路径，请人工检查"
          fi

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCamTweak-rootless-deb
          path: VCamTweak/packages/*.deb
          retention-days: 30

      - name: Upload fat dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCamTweak-fat-dylib
          path: |
            VCamTweak/.theos/obj/VCamTweak.dylib
            VCamTweak/.theos/obj/arm64/VCamTweak.dylib
            VCamTweak/.theos/obj/arm64e/VCamTweak.dylib
          retention-days: 30
